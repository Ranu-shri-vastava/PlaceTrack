<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Viewport — mobile responsive + PWA safe area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="msapplication-TileColor" content="#1e1b4b" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- App description -->
    <meta name="description" content="PlaceTrack - College Placement Management System. Manage students, companies, interviews and placements." />
    <meta name="keywords" content="placement tracker, college placement, student management, campus recruitment" />
    <meta name="author" content="PlaceTrack" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlaceTrack" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />

    <!-- iOS Splash screens -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="shortcut icon" href="/icons/icon-192x192.png" />

    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PlaceTrack" />

    <!-- Open Graph (share preview) -->
    <meta property="og:title" content="PlaceTrack - Placement Management System" />
    <meta property="og:description" content="Manage college placements — students, companies, interviews and analytics." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <title>PlaceTrack | Placement Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Splash screen while React loads */
      #splash {
        position: fixed; inset: 0;
        background: #1e1b4b;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-logo {
        width: 80px; height: 80px;
        background: #6366f1; border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      #splash-logo svg { width: 44px; height: 44px; }
      #splash h1 { color: white; font-size: 28px; font-weight: 700; font-family: 'Inter', sans-serif; letter-spacing: -0.5px; }
      #splash p  { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 8px; font-family: 'Inter', sans-serif; }
      #splash-dots { display: flex; gap: 6px; margin-top: 32px; }
      #splash-dots span {
        width: 8px; height: 8px; border-radius: 50%; background: #6366f1;
        animation: bounce 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
        50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(99,102,241,0); }
      }
      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Splash screen (hidden once React mounts) -->
    <div id="splash">
      <div id="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1>PlaceTrack</h1>
      <p>Placement Management System</p>
      <div id="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>

    <!-- Service Worker registration -->
    <script>
      // Hide splash once React app loads
      window.addEventListener('load', function () {
        setTimeout(function () {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function () { splash.remove(); }, 400);
          }
        }, 800);
      });

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('[PWA] Service Worker registered:', reg.scope);

              // Check for updates every 60 seconds
              setInterval(function () { reg.update(); }, 60000);

              // Notify user when new version is available
              reg.addEventListener('updatefound', function () {
                var newWorker = reg.installing;
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available — show a toast (handled by React app via custom event)
                    window.dispatchEvent(new CustomEvent('pwa-update-available'));
                    console.log('[PWA] New version available! Refresh to update.');
                  }
                });
              });
            })
            .catch(function (err) {
              console.log('[PWA] Service Worker registration failed:', err);
            });
        });
      }

      // PWA install prompt — capture and expose for in-app install button
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
        console.log('[PWA] Install prompt ready');
      });

      window.addEventListener('appinstalled', function () {
        window.deferredInstallPrompt = null;
        console.log('[PWA] App installed successfully!');
      });
    </script>
  </body>
</html>
