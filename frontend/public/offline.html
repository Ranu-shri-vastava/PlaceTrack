<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6366f1" />
  <title>Offline — PlaceTrack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1e1b4b;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: white; border-radius: 24px;
      padding: 48px 40px; text-align: center;
      max-width: 400px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon {
      width: 80px; height: 80px; background: #fee2e2;
      border-radius: 20px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; color: #ef4444; }
    h1 { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
    p  { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }
    .btn {
      background: #6366f1; color: white; border: none;
      padding: 12px 28px; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background .15s; text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #4f46e5; }
    .status {
      margin-top: 20px; font-size: 12px; color: #94a3b8;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>
      PlaceTrack needs an internet connection to load your placement data.
      Please check your connection and try again.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Try Again
    </button>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="statusText">Waiting for connection...</span>
    </div>
  </div>

  <script>
    // Auto-reload when connection returns
    window.addEventListener('online', function () {
      document.getElementById('dot').style.background = '#22c55e';
      document.getElementById('statusText').textContent = 'Connection restored! Reloading...';
      setTimeout(function () { window.location.href = '/'; }, 1000);
    });
    window.addEventListener('offline', function () {
      document.getElementById('dot').style.background = '#ef4444';
      document.getElementById('statusText').textContent = 'Still offline...';
    });
  </script>
</body>
</html>
